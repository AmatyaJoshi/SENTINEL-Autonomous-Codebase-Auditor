<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{--bg:#0b1020;--card:#121a2e;--line:#22304f;--fg:#e6ebf5;--muted:#8b9ac2;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--info:#60a5fa;--accent:#8b5cf6}
  @media (prefers-color-scheme: light){:root{--bg:#f6f7fb;--card:#fff;--line:#e3e7f0;--fg:#111827;--muted:#64708a}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif;padding:24px 16px}
  main{max-width:1100px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:28px 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .meta{color:var(--muted);font-size:13px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.tile b{display:block;font-size:26px;font-weight:700}.tile span{color:var(--muted);font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;animation:in .4s ease both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line)}
  .fixed,.pr_opened{color:var(--ok)}.verified{color:var(--info)}.refuted{color:var(--muted)}.candidate{color:var(--warn)}.regressed{color:var(--bad)}
  .sev-critical{background:#fb718533}.sev-high{background:#fbbf2433}.sev-medium{background:#60a5fa33}.sev-low{background:#8b9ac233}
  code,pre{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}pre{background:#0008;padding:12px;border-radius:10px;overflow:auto;max-height:420px}
  .diff .add{color:var(--ok)}.diff .del{color:var(--bad)}.diff .hunk{color:var(--accent)}
  details summary{cursor:pointer;color:var(--muted);margin:6px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  .banner{border-left:4px solid var(--warn);background:#fbbf2418;padding:10px 12px;border-radius:8px;margin:12px 0}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--info))}
</style>
</head>
<body><main id="app"><noscript><pre>{{MARKDOWN}}</pre></noscript></main>
<script id="summary" type="application/json">{{SUMMARY_JSON}}</script>
<script>
const S=JSON.parse(document.getElementById('summary').textContent);const $=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const diff=d=>esc(d).split('\n').map(l=>l.startsWith('+')&&!l.startsWith('+++')?`<span class="add">${l}</span>`:l.startsWith('-')&&!l.startsWith('---')?`<span class="del">${l}</span>`:l.startsWith('@@')?`<span class="hunk">${l}</span>`:l).join('\n');
const c=S.counts||{};const F=S.findings||[];const act=F.filter(f=>['fixed','pr_opened','verified','regressed'].includes(f.status));const rest=F.filter(f=>!['fixed','pr_opened','verified','regressed'].includes(f.status));
let h=`<h1>Sentinel audit report</h1><div class="meta">${esc(S.repo_url)} @ <code>${esc((S.commit_sha||'').slice(0,10))}</code> · generated ${esc(S.generated_at)} · Sentinel ${esc(S.sentinel_version)} · arm <code>${esc(S.arm)}</code></div>`;
if(!S.sandbox_ready)h+=`<div class="banner"><b>Sandbox unavailable.</b> Findings below are unverified candidates — no executable proof was possible for this run.</div>`;
if(S.stopped_early)h+=`<div class="banner">Stopped early: ${esc(S.stopped_early)}</div>`;
h+=`<div class="tiles">${[['Verified',act.length,'ok'],['Fixed',(c.fixed||0)+(c.pr_opened||0),'ok'],['PRs',c.pr_opened||0,'info'],['Refuted',c.refuted||0,'muted'],['LLM calls',S.llm_calls,'info'],['Cost',`$${(S.cost_usd||0).toFixed(2)}`,'warn'],['Duration',`${S.duration_s??'-'}s`,'muted']].map(([k,v])=>`<div class="tile"><b>${v}</b><span>${k}</span></div>`).join('')}</div>`;
h+=`<h2>Verified bugs (${act.length})</h2>`;
for(const f of act){h+=`<div class="card"><div><span class="pill sev-${f.severity}">${f.severity}</span> <span class="pill">${esc(f.category)}</span> <span class="pill ${f.status}">${f.status}</span> <span class="meta">#${f.rank} · <code>${esc(f.file)}:${f.line_start}</code> ${esc(f.symbol||'')} · confidence ${(f.confidence).toFixed(2)} · blast ${f.blast_radius}</span></div>
<p>${esc(f.explanation||f.description)}</p><p class="meta"><b>Triggering input:</b> ${esc(f.hypothesis)}</p><div class="bar"><i style="width:${Math.round(f.confidence*100)}%"></i></div>
${f.pr_url?`<p><a href="${esc(f.pr_url)}">Pull request →</a></p>`:''}
${f.test_code?`<details><summary>Failing test <code>${esc(f.test_path)}</code></summary><pre>${esc(f.test_code)}</pre></details>`:''}
${f.patch_diff?`<details open><summary>Patch</summary><pre class="diff">${diff(f.patch_diff)}</pre></details>`:''}
${f.regress_log&&f.regress_log.includes('REGRESSED')?`<div class="banner">Patch discarded: ${esc(f.regress_log.split('REGRESSED:').pop().slice(0,300))}</div>`:''}
<details><summary>Verify log</summary><pre>${esc(f.verify_log||'')}</pre></details></div>`}
h+=`<h2>Unverified suspicions (${rest.length})</h2><p class="meta">Reported for transparency; these did not survive verification.</p><div class="card"><table><tr><th>#</th><th>category</th><th>location</th><th>conf</th><th>status</th><th>reason</th></tr>${rest.map(f=>`<tr><td>${f.rank??''}</td><td>${esc(f.category)}</td><td><code>${esc(f.file)}:${f.line_start}</code></td><td>${f.confidence.toFixed(2)}</td><td class="${f.status}">${f.status}</td><td>${esc((f.verify_log||'').split('\n')[0].slice(0,90))}</td></tr>`).join('')}</table></div>`;
if((S.errors||[]).length)h+=`<h2>Errors</h2><div class="card"><ul>${S.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`;
$.innerHTML=h;
</script>
</body>
</html>
