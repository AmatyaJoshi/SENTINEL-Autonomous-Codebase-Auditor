# Full local stack: API + dashboard, Postgres + pgvector, Jaeger.
#   docker compose up -d            # everything
#   docker compose up -d postgres jaeger   # infra only, run `uv run onix serve` on the host
services:
  onix:
    build: .
    image: onix:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ONIX_DATABASE_URL: postgresql+psycopg://onix:onix@postgres:5432/onix
      ONIX_OTLP_ENDPOINT: http://jaeger:4317
      ONIX_WORK_DIR: /data
      ONIX_API_KEYS: ${ONIX_API_KEYS:-}
      ONIX_ANTHROPIC_API_KEY: ${ONIX_ANTHROPIC_API_KEY:-}
      ONIX_OPENAI_API_KEY: ${ONIX_OPENAI_API_KEY:-}
      ONIX_GITHUB_TOKEN: ${ONIX_GITHUB_TOKEN:-}
      ONIX_API_CORS_ORIGINS: ${ONIX_API_CORS_ORIGINS:-http://localhost:8000}
      ONIX_OPENROUTER_API_KEY: ${ONIX_OPENROUTER_API_KEY:-}
      ONIX_EXECUTION_MODE: ${ONIX_EXECUTION_MODE:-inline}
      ONIX_ENVIRONMENT: prod
    ports:
      - "8000:8000"
    volumes:
      - onix-data:/data
      # Sandboxes are sibling containers; the socket is the only privilege this service needs.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Optional: horizontal execution. Set ONIX_EXECUTION_MODE=queue on `onix` and scale this.
  worker:
    build: .
    image: onix:local
    command: ["worker"]
    profiles: ["queue"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ONIX_DATABASE_URL: postgresql+psycopg://onix:onix@postgres:5432/onix
      ONIX_OTLP_ENDPOINT: http://jaeger:4317
      ONIX_WORK_DIR: /data
      ONIX_OPENROUTER_API_KEY: ${ONIX_OPENROUTER_API_KEY:-}
      ONIX_ANTHROPIC_API_KEY: ${ONIX_ANTHROPIC_API_KEY:-}
      ONIX_OPENAI_API_KEY: ${ONIX_OPENAI_API_KEY:-}
      ONIX_GITHUB_TOKEN: ${ONIX_GITHUB_TOKEN:-}
      ONIX_ENVIRONMENT: prod
    volumes:
      - onix-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: onix
      POSTGRES_PASSWORD: onix
      POSTGRES_DB: onix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onix"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

volumes:
  pgdata:
  onix-data:
