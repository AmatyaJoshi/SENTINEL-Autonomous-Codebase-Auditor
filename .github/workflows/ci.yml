name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: type-check
        run: uv run mypy
      - name: unit + e2e tests (scripted LLM, mocked Docker)
        run: uv run pytest -o addopts="" -q --timeout=600
      - name: cli smoke
        run: uv run sentinel --help
      - name: migrations apply to a fresh database
        env:
          SENTINEL_DATABASE_URL: sqlite:///${{ runner.temp }}/ci.sqlite
        run: uv run sentinel db upgrade && uv run sentinel db current
      - name: helm chart lints
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash >/dev/null
          helm lint deploy/helm/sentinel

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sentinel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build sandbox base images
        run: |
          docker build -f sentinel/sandbox/images/Dockerfile.python -t sentinel-base-python:3.12 sentinel/sandbox/images
          docker build -f sentinel/sandbox/images/Dockerfile.node -t sentinel-base-node:20 sentinel/sandbox/images
