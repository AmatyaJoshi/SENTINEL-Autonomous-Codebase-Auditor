name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Jobs are independent so wall-clock time is the slowest job (tests), not the sum.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: unit + e2e tests (scripted LLM, mocked Docker)
        run: uv run pytest -o addopts="" -q --timeout=600 -p no:cacheprovider
      - name: cli smoke + migrations on a fresh database
        env:
          ONIX_DATABASE_URL: sqlite:///${{ runner.temp }}/ci.sqlite
        run: |
          uv run onix --help
          uv run onix db upgrade
          uv run onix db current

  deploy-manifests:
    # Only the chart and compose file matter here; skipped entirely for unrelated changes.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            deploy:
              - 'deploy/**'
              - 'docker-compose.yml'
              - 'Dockerfile'
      - uses: azure/setup-helm@v4
        if: steps.changes.outputs.deploy == 'true'
        with:
          version: v3.16.2
      - run: helm lint deploy/helm/onix
        if: steps.changes.outputs.deploy == 'true'
      - run: helm template onix deploy/helm/onix >/dev/null
        if: steps.changes.outputs.deploy == 'true'
      - run: docker compose config -q
        if: steps.changes.outputs.deploy == 'true'

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [lint, test, dashboard]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: onix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build sandbox base images
        run: |
          docker build -f onix/sandbox/images/Dockerfile.python -t onix-base-python:3.12 onix/sandbox/images
          docker build -f onix/sandbox/images/Dockerfile.node -t onix-base-node:20 onix/sandbox/images
