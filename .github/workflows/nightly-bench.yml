name: nightly-bench
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  small-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: benchmark (small suite)
        env:
          SENTINEL_ANTHROPIC_API_KEY: ${{ secrets.SENTINEL_ANTHROPIC_API_KEY }}
        run: uv run python bench/run_bench.py --suite small
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: bench/out/
