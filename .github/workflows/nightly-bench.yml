name: nightly-bench
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  small-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Requires an LLM key; the job is skipped (not failed) when the secret is absent.
    if: ${{ vars.BENCH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: build sandbox base images
        run: |
          docker build -f onix/sandbox/images/Dockerfile.python -t onix-base-python:3.12 onix/sandbox/images
          docker build -f onix/sandbox/images/Dockerfile.node -t onix-base-node:20 onix/sandbox/images
      - name: benchmark (small suite, all four arms)
        env:
          ONIX_ANTHROPIC_API_KEY: ${{ secrets.ONIX_ANTHROPIC_API_KEY }}
          ONIX_OPENAI_API_KEY: ${{ secrets.ONIX_OPENAI_API_KEY }}
          ONIX_WORK_DIR: ${{ runner.temp }}/onix
        run: uv run python bench/run_bench.py --suite small
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: |
            bench/out/report.html
            bench/out/report.json
            bench/out/manifest.json
            bench/RESULTS.md
