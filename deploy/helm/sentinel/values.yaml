image:
  repository: ghcr.io/amatyajoshi/sentinel
  tag: "0.1.0"
  pullPolicy: IfNotPresent

api:
  replicas: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

worker:
  enabled: true
  replicas: 2
  # Workers need a Docker engine to run sandboxes. Default: a rootless docker:dind sidecar with
  # its own storage; alternatively point DOCKER_HOST at a dedicated sandbox node pool.
  dind:
    enabled: true
    image: docker:27-dind-rootless
    storage: 40Gi
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "4", memory: 8Gi }

persistence:
  enabled: true
  size: 20Gi
  storageClass: ""

postgres:
  # External Postgres 16 with pgvector (recommended for prod). Leave empty to use SQLite on the PVC
  # (single API replica only).
  url: ""            # postgresql+psycopg://sentinel:...@host:5432/sentinel   (or a secret ref below)
  urlSecret: { name: "", key: "" }

secrets:
  # Names of existing Kubernetes Secrets; keys become SENTINEL_* env vars via envFrom.
  existingSecret: sentinel-secrets   # e.g. SENTINEL_OPENROUTER_API_KEY, SENTINEL_API_KEYS, SENTINEL_GITHUB_TOKEN

config:
  logJson: "1"
  environment: prod
  executionMode: queue
  otlpEndpoint: ""                   # http://otel-collector:4317
  corsOrigins: "https://sentinel.example.com"
  retentionDays: "30"
  primaryModel: ""                   # leave empty to use the defaults resolved from available keys
  cheapModel: ""

ingress:
  enabled: true
  className: nginx
  host: sentinel.example.com
  tls: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # SSE
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

serviceMonitor:
  enabled: false   # set true when kube-prometheus-stack is installed
  interval: 30s

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10002
  fsGroup: 10002
