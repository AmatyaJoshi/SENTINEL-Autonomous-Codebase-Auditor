[project]
name = "sentinel"
version = "0.1.0"
description = "Autonomous codebase auditor: finds bugs, proves them with failing tests in a sandbox, fixes them, opens PRs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.21",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=1.0",
    "langchain-core>=0.3",
    "litellm>=1.40",
    "gitpython>=3.1",
    "pygithub>=2.3",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "traceloop-sdk>=0.30",
    "networkx>=3.3",
    "docker>=7.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "tree-sitter>=0.25,<0.26",  # 0.26.0 access-violates on Windows during node access
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-javascript>=0.25.0",
    "bandit>=1.9.4",
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "semgrep>=1.177.0 ; sys_platform != 'win32'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3", "langgraph-checkpoint-postgres>=1.0"]

[project.scripts]
sentinel = "sentinel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "types-PyYAML",
    "types-docker",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md", "tests/fixtures"]
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel", "bench", "training"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sentinel"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv", "node_modules"]
asyncio_mode = "auto"
addopts = "-q"
